<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShellCrash 订阅更新器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Cpath d='M18 22h28M18 32h18M18 42h28' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M46 18v28' stroke='%2393c5fd' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --text: #1d1d1f;
      --text-soft: #3c3c43;
      --muted: rgba(60, 60, 67, 0.68);
      --muted-faint: rgba(60, 60, 67, 0.44);
      --accent: #007aff;
      --accent-strong: #006edb;
      --accent-primary-top: #1688ff;
      --accent-primary-bottom: #006ee6;
      --accent-primary-hover-bottom: #005fc8;
      --danger: #ff3b30;
      --danger-text: #c5221f;
      --ok: #34c759;
      --ok-text: #18833a;
      --canvas-base: #eaf3ff;
      --canvas-top: #f7fbff;
      --canvas-mid: #e7f3ff;
      --canvas-end: #f7f1ff;
      --surface: rgba(246, 251, 255, 0.36);
      --surface-strong: rgba(255, 255, 255, 0.46);
      --surface-control: rgba(255, 255, 255, 0.48);
      --surface-recessed: rgba(247, 251, 255, 0.34);
      --hairline: rgba(255, 255, 255, 0.68);
      --stroke: rgba(75, 96, 128, 0.14);
      --stroke-soft: rgba(75, 96, 128, 0.1);
      --status-ok-bg: rgba(52, 199, 89, 0.14);
      --status-ok-border: rgba(52, 199, 89, 0.24);
      --status-run-bg: rgba(0, 122, 255, 0.11);
      --status-run-border: rgba(0, 122, 255, 0.22);
      --status-error-bg: rgba(255, 59, 48, 0.11);
      --status-error-border: rgba(255, 59, 48, 0.22);
      --shadow-panel: 0 30px 80px rgba(35, 47, 75, 0.16), 0 8px 24px rgba(35, 47, 75, 0.08);
      --shadow-control: 0 1px 1px rgba(255, 255, 255, 0.78) inset, 0 1px 2px rgba(35, 47, 75, 0.06);
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-size-title: 22px;
      --font-size-body: 14px;
      --font-size-label: 13px;
      --font-size-hint: 12.5px;
      --font-size-button: 13px;
      --font-size-progress-title: 15px;
      --font-size-log: 12px;
      --line-height-ui: 1.45;
      --line-height-tight: 1.2;
      --line-height-label: 1.25;
      --line-height-log: 1.55;
      --font-weight-title: 700;
      --font-weight-label: 650;
      --font-weight-button: 650;
      --font-weight-status: 700;
      --font-weight-body: 400;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --app-max-width: 1620px;
      --app-idle-width: 980px;
      --app-gutter: 20px;
      --app-gap: 14px;
      --progress-width-min: 320px;
      --progress-width-max: 420px;
      --radius-window: 30px;
      --radius-panel: 24px;
      --radius-control: 13px;
      --radius-small: 10px;
      --radius-pill: 999px;
      --transition-fast: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --transition-fluid: 420ms cubic-bezier(0.22, 1, 0.36, 1);
      --focus-ring: 0 0 0 4px rgba(0, 122, 255, 0.2), 0 0 0 1px rgba(0, 122, 255, 0.42);
    }

    * { box-sizing: border-box; }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font: var(--font-size-body)/var(--line-height-ui) var(--font-ui);
      color: var(--text);
      background: var(--canvas-base);
      position: relative;
      isolation: isolate;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -4;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(246, 249, 255, 0.68)),
        var(--canvas-base);
      pointer-events: none;
    }

    .bg-iridescent {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(1100px 720px at 16% 26%, rgba(79, 151, 255, 0.3), transparent 62%),
        radial-gradient(860px 620px at 85% 16%, rgba(178, 121, 255, 0.17), transparent 58%),
        radial-gradient(900px 620px at 70% 92%, rgba(255, 125, 160, 0.15), transparent 60%),
        linear-gradient(135deg, var(--canvas-top) 0%, var(--canvas-mid) 44%, var(--canvas-end) 100%);
    }

    .bg-blobs,
    .bg-orb {
      display: none;
    }

    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.018;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    main {
      width: min(var(--app-max-width), calc(100% - (var(--app-gutter) * 2)));
      margin: 44px auto 40px;
      padding: 18px 26px 24px;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(var(--progress-width-min), var(--progress-width-max));
      align-items: stretch;
      gap: var(--app-gap);
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: var(--radius-window);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.42), rgba(235, 246, 255, 0.22)),
        rgba(240, 248, 255, 0.24);
      box-shadow:
        0 34px 90px rgba(35, 47, 75, 0.18),
        0 8px 26px rgba(35, 47, 75, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(46px) saturate(190%);
      -webkit-backdrop-filter: blur(46px) saturate(190%);
      overflow: hidden;
    }

    h1 {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin: 0 0 2px;
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-title);
      line-height: var(--line-height-tight);
      letter-spacing: 0;
      color: var(--text);
      position: relative;
      z-index: 1;
    }

    h1 svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
      filter: drop-shadow(0 5px 12px rgba(0, 122, 255, 0.22));
      flex-shrink: 0;
    }

    @keyframes panel-enter {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes status-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.18); }
      50% { box-shadow: 0 0 0 7px rgba(0, 122, 255, 0); }
    }

    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-panel);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.5), rgba(229, 243, 255, 0.24)),
        var(--surface);
      box-shadow:
        0 18px 46px rgba(35, 47, 75, 0.1),
        0 4px 16px rgba(35, 47, 75, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(38px) saturate(190%);
      -webkit-backdrop-filter: blur(38px) saturate(190%);
      color: var(--text);
      animation: panel-enter var(--transition-fluid) both;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.46), transparent 34%),
        linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.18) 42%, transparent 66%);
      opacity: 0.62;
    }

    main > .panel > * {
      position: relative;
      z-index: 1;
    }

    main > .panel {
      z-index: 1;
    }

    main > .panel:first-of-type {
      min-height: 0;
    }

    main > .panel:first-of-type {
      grid-column: 1;
    }

    main > .panel:last-of-type {
      grid-column: 1 / -1;
      padding: 18px 22px 22px;
    }

    .panel--progress {
      display: block;
      grid-column: 2;
      grid-row: 2;
      align-self: stretch;
      height: 100%;
      min-height: 0;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-label);
      line-height: var(--line-height-label);
      color: var(--text);
    }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid var(--stroke-soft);
      border-radius: var(--radius-control);
      padding: 10px 13px;
      font: inherit;
      color: var(--text);
      background: var(--surface-control);
      box-shadow: 0 1px 1px rgba(255, 255, 255, 0.62) inset, 0 1px 2px rgba(35, 47, 75, 0.05);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      transition:
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast),
        transform var(--transition-fast);
    }

    input[type="text"]:hover,
    input[type="password"]:hover,
    textarea:hover {
      background: rgba(255, 255, 255, 0.75);
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="file"]:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(0, 122, 255, 0.46);
      box-shadow: var(--focus-ring), var(--shadow-control);
      background: rgba(255, 255, 255, 0.7);
    }

    input[type="text"]:focus-visible,
    input[type="password"]:focus-visible,
    input[type="file"]:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    a.button:focus-visible,
    input[type="checkbox"]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      font-family: var(--font-mono);
      font-size: var(--font-size-log);
      line-height: var(--line-height-log);
    }

    textarea#output {
      min-height: 215px;
      background: rgba(250, 252, 255, 0.42);
      color: #20242c;
      border-color: rgba(60, 60, 67, 0.1);
      box-shadow: inset 0 1px 4px rgba(35, 47, 75, 0.05), 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .row {
      margin-bottom: 14px;
    }

    .hint {
      color: var(--muted);
      margin: 5px 0 0;
      font-size: var(--font-size-hint);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin-top: 16px;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(247, 251, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.68), 0 10px 28px rgba(35, 47, 75, 0.07);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
    }

    button,
    a.button,
    .file-select-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(60, 60, 67, 0.1);
      padding: 9px 16px;
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.48);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-button);
      line-height: 1.15;
      box-shadow: var(--shadow-control);
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        color var(--transition-fast),
        opacity var(--transition-fast),
        transform var(--transition-fast);
      white-space: nowrap;
    }

    .action-primary {
      color: #fff;
      border-color: rgba(0, 95, 200, 0.18);
      background: linear-gradient(180deg, var(--accent-primary-top), var(--accent-primary-bottom));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        0 8px 18px rgba(0, 122, 255, 0.28);
    }

    .action-tonal,
    .file-select-button {
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.5);
    }

    .action-ghost {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(0, 122, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    button.secondary,
    a.secondary {
      color: var(--text-soft);
      background: rgba(255, 255, 255, 0.46);
    }

    button:active:not(:disabled),
    a.button:active:not([aria-disabled="true"]),
    .file-select-button:active {
      transform: scale(0.975);
    }

    button:hover:not(:disabled),
    a.button:hover:not([aria-disabled="true"]),
    .file-select-button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.82);
      border-color: rgba(0, 122, 255, 0.18);
      box-shadow: 0 8px 20px rgba(35, 47, 75, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .action-primary:hover:not(:disabled) {
      color: #fff;
      background: linear-gradient(180deg, var(--accent), var(--accent-primary-hover-bottom));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        0 10px 24px rgba(0, 122, 255, 0.34);
    }

    .action-tonal:hover:not(:disabled),
    a.action-tonal:hover:not([aria-disabled="true"]) {
      color: var(--accent-strong);
      background: rgba(255, 255, 255, 0.72);
      border-color: rgba(0, 122, 255, 0.22);
    }

    .action-ghost:hover:not(:disabled),
    a.action-ghost:hover:not([aria-disabled="true"]) {
      color: var(--accent-strong);
      background: rgba(255, 255, 255, 0.58);
      border-color: rgba(0, 122, 255, 0.18);
    }

    button:disabled,
    a.button[aria-disabled="true"] {
      opacity: 0.48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .check {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      color: var(--text-soft);
      cursor: pointer;
      padding: 4px 0;
      border-radius: var(--radius-control);
    }

    .check input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .auth-options {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-width: min(360px, 100%);
      margin-top: 3px;
      padding: 3px;
      border: 1px solid var(--stroke-soft);
      border-radius: var(--radius-control);
      background: rgba(255, 255, 255, 0.32);
      box-shadow: inset 0 1px 2px rgba(35, 47, 75, 0.04);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    .auth-option {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      margin: 0;
      padding: 7px 14px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: var(--font-weight-button);
      transition:
        background var(--transition-fast),
        box-shadow var(--transition-fast),
        color var(--transition-fast);
    }

    .auth-option:has(input:checked) {
      color: var(--accent-strong);
      background: rgba(255, 255, 255, 0.54);
      box-shadow: 0 1px 1px rgba(255, 255, 255, 0.9) inset, 0 3px 9px rgba(35, 47, 75, 0.08);
    }

    .auth-option input {
      accent-color: var(--accent);
      margin: 0;
    }

    .is-hidden {
      display: none !important;
    }

    .status {
      margin-left: auto;
      padding: 7px 13px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(60, 60, 67, 0.1);
      box-shadow: var(--shadow-control);
      font-size: var(--font-size-hint);
      font-weight: var(--font-weight-status);
      white-space: nowrap;
      transition:
        color var(--transition-fast),
        background var(--transition-fast),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .status.ok {
      color: var(--ok-text);
      background: var(--status-ok-bg);
      border-color: var(--status-ok-border);
    }

    .status.err {
      color: var(--danger-text);
      background: var(--status-error-bg);
      border-color: var(--status-error-border);
    }

    .status.run {
      color: var(--accent-strong);
      background: var(--status-run-bg);
      border-color: var(--status-run-border);
      animation: status-pulse 2s ease-in-out infinite;
    }

    .file-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      min-height: 52px;
      padding: 8px;
      border-radius: 16px;
      background: var(--surface-recessed);
      border: 1px solid var(--stroke-soft);
      box-shadow: inset 0 1px 2px rgba(35, 47, 75, 0.04);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
    }

    .file-picker input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .file-picker input[type="file"]:focus-visible + .file-select-button {
      box-shadow: var(--focus-ring);
    }

    .file-meta {
      flex: 1 1 100%;
      color: var(--muted);
      font-size: var(--font-size-hint);
      word-break: break-word;
    }

    .file-meta.selected {
      color: var(--text-soft);
    }

    .progress-panel {
      display: block;
      position: relative;
      height: 100%;
    }

    .progress-panel:has(#closeProgressBtn:not(:disabled)) {
      padding-bottom: 48px;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--stroke-soft);
    }

    .progress-title {
      flex: 1 1 180px;
      margin: 0;
      font-size: var(--font-size-progress-title);
      font-weight: var(--font-weight-title);
      color: var(--text);
    }

    .progress-actions {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .progress-panel:has(#closeProgressBtn:not(:disabled)) .progress-actions {
      position: absolute;
      right: 0;
      bottom: 0;
      z-index: 2;
    }

    .progress-actions button {
      min-height: 32px;
      padding: 7px 12px;
      font-size: 12px;
    }

    .stage-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0;
    }

    .stage-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 56px;
      color: var(--muted);
      padding: 4px 2px 14px;
      background: transparent;
      border: 0;
      border-radius: 0;
      transition: color var(--transition-fast);
    }

    .stage-item span:last-child {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 16px;
      width: 100%;
      min-width: 0;
    }

    .stage-item strong {
      grid-column: 1;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-label);
      line-height: var(--line-height-tight);
    }

    .stage-item small {
      grid-column: 1;
      color: var(--muted);
      font-size: var(--font-size-hint);
      line-height: var(--line-height-ui);
    }

    .stage-item time {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: start;
      color: var(--muted);
      font-size: var(--font-size-hint);
      line-height: var(--line-height-tight);
      white-space: nowrap;
    }

    .stage-item:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 24px;
      bottom: 0;
      width: 1px;
      background: rgba(60, 60, 67, 0.14);
    }

    .stage-dot {
      position: relative;
      z-index: 1;
      width: 17px;
      height: 17px;
      margin-top: 1px;
      border-radius: 999px;
      background: #c7c7cc;
      flex: 0 0 17px;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition:
      background var(--transition-fast),
        box-shadow var(--transition-fast),
        transform var(--transition-fast);
    }

    .stage-dot::after {
      content: "";
      position: absolute;
      inset: 4px 5px 5px 4px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      opacity: 0;
      transform: rotate(45deg) scale(0.86);
      transform-origin: center;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .stage-item.active {
      color: var(--text);
    }

    .stage-item.active .stage-dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12), 0 0 16px rgba(0, 122, 255, 0.28);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }

    .stage-item.done {
      color: var(--text);
    }

    .stage-item.done .stage-dot {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .stage-item.done .stage-dot::after {
      opacity: 1;
      transform: rotate(45deg) scale(1);
    }

    .stage-item.error {
      color: var(--danger);
    }

    .stage-item.error .stage-dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .panel,
      .actions,
      .auth-options,
      input[type="text"],
      input[type="password"],
      textarea {
        background: rgba(255, 255, 255, 0.92);
      }
    }

    @media (max-width: 1060px) {
      main {
        grid-template-columns: minmax(0, 1fr);
      }

      .panel--progress {
        grid-column: 1;
      }
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 28px, var(--app-max-width));
        margin: 18px auto 28px;
        padding: 20px 14px 14px;
        border-radius: 24px;
      }

      h1 {
        justify-content: flex-start;
        font-size: 20px;
        margin: 0 0 20px;
        padding-left: 0;
      }

      .panel {
        padding: 18px;
        border-radius: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .actions {
        padding: 10px;
      }

      .actions > button,
      .actions > a.button {
        flex: 1 1 140px;
      }

      .status {
        width: 100%;
        margin-left: 0;
        text-align: center;
      }

      .auth-options {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-iridescent" aria-hidden="true"></div>
  <svg class="bg-blobs" aria-hidden="true" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="blobGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#007AFF" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#5AC8FA" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#AF52DE" stop-opacity="0.15"/>
      </linearGradient>
      <linearGradient id="blobGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#AF52DE" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#FF2D55" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="blobGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#5AC8FA" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#007AFF" stop-opacity="0.12"/>
      </linearGradient>
      <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="45"/>
      </filter>
    </defs>
    <path fill="url(#blobGrad1)" filter="url(#blobBlur)">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M120,280 C120,120 280,80 400,160 C520,240 560,400 420,480 C280,560 120,440 120,280;
                M140,260 C80,140 300,60 440,180 C580,300 500,460 360,500 C220,540 140,380 140,260;
                M120,280 C120,120 280,80 400,160 C520,240 560,400 420,480 C280,560 120,440 120,280"/>
    </path>
    <path fill="url(#blobGrad2)" filter="url(#blobBlur)">
      <animate attributeName="d" dur="15s" repeatCount="indefinite"
        values="M550,100 C700,80 780,220 720,360 C660,500 520,520 440,420 C360,320 400,120 550,100;
                M530,120 C680,100 760,250 700,380 C640,510 500,500 420,400 C340,300 380,140 530,120;
                M550,100 C700,80 780,220 720,360 C660,500 520,520 440,420 C360,320 400,120 550,100"/>
    </path>
    <path fill="url(#blobGrad3)" filter="url(#blobBlur)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M200,450 C100,380 80,520 180,560 C280,600 380,540 360,460 C340,380 300,520 200,450;
                M220,430 C120,360 100,500 200,540 C300,580 400,520 380,440 C360,360 320,500 220,430;
                M200,450 C100,380 80,520 180,560 C280,600 380,540 360,460 C340,380 300,520 200,450"/>
    </path>
  </svg>
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <main>
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      ShellCrash 订阅更新器
    </h1>

    <section class="panel">
      <div class="row">
        <label for="subscriptionUrl">订阅地址</label>
        <input id="subscriptionUrl" type="text" autocomplete="off">
        <p class="hint">支持 v2rayN/V2Ray 原始订阅，转换在本机完成。</p>
      </div>
      <div class="grid">
        <div class="row">
          <label for="routerHost">路由器 IP</label>
          <input id="routerHost" type="text" autocomplete="off">
        </div>
        <div id="privateKeyRow" class="row">
          <label for="privateKey">SSH 私钥路径</label>
          <input id="privateKey" type="text" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <label>登录方式</label>
        <div class="auth-options">
          <label class="auth-option">
            <input name="authMethod" type="radio" value="privateKey" checked>
            SSH 私钥
          </label>
          <label class="auth-option">
            <input name="authMethod" type="radio" value="password">
            密码
          </label>
        </div>
        <p class="hint">密码只用于本次上传任务，不会写入 config.json。</p>
      </div>
      <div id="passwordRow" class="row is-hidden">
        <label for="sshPassword">SSH 密码</label>
        <input id="sshPassword" type="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label for="localYaml">本地 YAML 输出路径</label>
        <input id="localYaml" type="text" autocomplete="off">
      </div>
      <div class="row">
        <label for="yamlFile">上传指定 YAML 文件</label>
        <div class="file-picker">
          <input id="yamlFile" type="file" accept=".yaml,.yml,application/x-yaml,text/yaml,text/plain">
          <label for="yamlFile" class="file-select-button">选择 YAML 文件</label>
          <button id="clearYamlBtn" type="button" class="secondary" hidden>取消已选文件</button>
        </div>
        <p id="yamlFileMeta" class="file-meta">未选择文件时，会上传 out 目录中按文件名排序的第一个 .yaml/.yml 文件。</p>
      </div>
      <label class="check">
        <input id="restartShellCrash" type="checkbox">
        上传成功后重启 ShellCrash
      </label>
      <div class="actions">
        <button id="saveBtn" class="action-ghost">保存配置</button>
        <button id="convertBtn" class="action-tonal">仅生成 YAML</button>
        <button id="uploadBtn" class="action-primary">生成并上传</button>
        <button id="uploadYamlBtn" class="action-tonal">上传 YAML</button>
        <a id="downloadBtn" class="button action-ghost" href="/api/download">下载 YAML</a>
        <span id="status" class="status">就绪</span>
      </div>
    </section>

    <section id="progressSection" class="panel panel--progress">
      <div id="progressPanel" class="progress-panel">
        <div class="progress-header">
          <p id="progressTitle" class="progress-title">执行进度</p>
          <div class="progress-actions">
            <button id="cancelTaskBtn" type="button" class="secondary" hidden>取消任务</button>
            <button id="closeProgressBtn" type="button" class="secondary" hidden disabled>清空进度</button>
          </div>
        </div>
        <ol id="stageList" class="stage-list"></ol>
      </div>
    </section>

    <section class="panel">
      <label for="output">执行日志</label>
      <textarea id="output" readonly></textarea>
    </section>
  </main>

  <script>
    const TASK_TITLES = {
      convert: "仅生成 YAML",
      upload: "生成并上传",
      "upload-yaml": "上传 YAML"
    };
    const DEFAULT_STAGES = [
      "preparing",
      "reading-yaml",
      "starting-subconverter",
      "converting",
      "writing-yaml",
      "uploading-router",
      "validating-config",
      "restarting-shellcrash",
      "finished"
    ];
    const STAGE_COPY = {
      preparing: {
        title: "准备配置",
        idle: "等待读取订阅、路由器与认证参数",
        active: "正在整理本次任务所需配置",
        done: "任务配置已确认"
      },
      "reading-yaml": {
        title: "定位 YAML 文件",
        idle: "上传 YAML 时会优先使用指定文件",
        active: "正在读取指定文件或 out 目录中的 YAML",
        done: "YAML 输入已准备"
      },
      "starting-subconverter": {
        title: "启动 subconverter",
        idle: "需要转换订阅时会自动拉起本地转换器",
        active: "正在检查并启动本地 subconverter",
        done: "subconverter 已就绪"
      },
      converting: {
        title: "转换订阅",
        idle: "生成 Clash YAML 前会在本机完成转换",
        active: "正在把原始订阅转换为 Clash 配置",
        done: "订阅转换完成"
      },
      "writing-yaml": {
        title: "写入 YAML",
        idle: "转换结果会写入本地输出路径",
        active: "正在写入本地 YAML 文件",
        done: "YAML 文件已生成"
      },
      "uploading-router": {
        title: "上传到路由器",
        idle: "上传任务会通过 SSH 发送到路由器",
        active: "正在连接路由器并上传 YAML",
        done: "路由器文件已更新"
      },
      "installing-shellcrash": {
        title: "安装到 ShellCrash",
        idle: "需要时会把配置同步到 ShellCrash",
        active: "正在应用 ShellCrash 配置",
        done: "ShellCrash 配置已应用"
      },
      "validating-config": {
        title: "校验配置",
        idle: "上传后会校验关键配置状态",
        active: "正在检查配置是否可用",
        done: "配置校验通过"
      },
      "restarting-shellcrash": {
        title: "重启 ShellCrash",
        idle: "勾选重启后会在上传完成后执行",
        active: "正在重启 ShellCrash 服务",
        done: "ShellCrash 已重启"
      },
      finished: {
        title: "完成",
        idle: "任务结束后会在这里保留最终状态",
        active: "正在收尾并刷新日志",
        done: "全部阶段已完成"
      }
    };
    const fields = {
      subscriptionUrl: document.querySelector("#subscriptionUrl"),
      routerHost: document.querySelector("#routerHost"),
      privateKey: document.querySelector("#privateKey"),
      authMethod: [...document.querySelectorAll("input[name='authMethod']")],
      sshPassword: document.querySelector("#sshPassword"),
      localYaml: document.querySelector("#localYaml"),
      yamlFile: document.querySelector("#yamlFile"),
      restartShellCrash: document.querySelector("#restartShellCrash")
    };
    const statusEl = document.querySelector("#status");
    const outputEl = document.querySelector("#output");
    const yamlFileMetaEl = document.querySelector("#yamlFileMeta");
    const clearYamlBtn = document.querySelector("#clearYamlBtn");
    const privateKeyRowEl = document.querySelector("#privateKeyRow");
    const passwordRowEl = document.querySelector("#passwordRow");
    const progressSectionEl = document.querySelector("#progressSection");
    const progressPanelEl = document.querySelector("#progressPanel");
    const progressTitleEl = document.querySelector("#progressTitle");
    const stageListEl = document.querySelector("#stageList");
    const cancelTaskBtn = document.querySelector("#cancelTaskBtn");
    const closeProgressBtn = document.querySelector("#closeProgressBtn");
    const busyButtons = [
      document.querySelector("#saveBtn"),
      document.querySelector("#convertBtn"),
      document.querySelector("#uploadBtn"),
      document.querySelector("#uploadYamlBtn"),
      clearYamlBtn
    ];
    let activePoll = null;
    let activeTaskId = null;

    function payload() {
      return {
        subscriptionUrl: fields.subscriptionUrl.value,
        routerHost: fields.routerHost.value,
        privateKey: fields.privateKey.value,
        authMethod: selectedAuthMethod(),
        sshPassword: selectedAuthMethod() === "password" ? fields.sshPassword.value : "",
        localYaml: fields.localYaml.value,
        restartShellCrash: fields.restartShellCrash.checked
      };
    }

    function selectedAuthMethod() {
      return fields.authMethod.find(input => input.checked)?.value || "privateKey";
    }

    function setAuthMethod(method) {
      fields.authMethod.forEach(input => {
        input.checked = input.value === method;
      });
      updateAuthFields();
    }

    function updateAuthFields() {
      const usePassword = selectedAuthMethod() === "password";
      privateKeyRowEl.classList.toggle("is-hidden", usePassword);
      passwordRowEl.classList.toggle("is-hidden", !usePassword);
      fields.privateKey.disabled = usePassword;
      fields.sshPassword.disabled = !usePassword;
    }

    function updateYamlFileMeta() {
      const file = fields.yamlFile.files[0];
      if (file) {
        yamlFileMetaEl.textContent = `已选择：${file.name}（${(file.size / 1024).toFixed(1)} KB）`;
        yamlFileMetaEl.classList.add("selected");
        clearYamlBtn.hidden = false;
        return;
      }
      yamlFileMetaEl.textContent = "未选择文件时，会上传 out 目录中按文件名排序的第一个 .yaml/.yml 文件。";
      yamlFileMetaEl.classList.remove("selected");
      clearYamlBtn.hidden = true;
    }

    function clearSelectedYaml() {
      fields.yamlFile.value = "";
      updateYamlFileMeta();
    }

    function readSelectedYaml() {
      const file = fields.yamlFile.files[0];
      if (!file) return Promise.resolve({});
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          yamlName: file.name,
          yamlText: String(reader.result || "")
        });
        reader.onerror = () => reject(new Error("读取 YAML 文件失败"));
        reader.readAsText(file);
      });
    }

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`;
    }

    function stageCopy(stage) {
      return STAGE_COPY[stage] || {
        title: stageLabel(stage),
        idle: "等待该阶段开始",
        active: "正在处理该阶段",
        done: "该阶段已完成"
      };
    }

    function renderStageItem(stage, state = "idle", detail = "") {
      const copy = stageCopy(stage);
      const item = document.createElement("li");
      const dot = document.createElement("span");
      const text = document.createElement("span");
      const title = document.createElement("strong");
      const note = document.createElement("small");
      item.className = `stage-item ${state}`;
      dot.className = "stage-dot";
      title.textContent = copy.title;
      note.textContent = detail || copy[state] || copy.idle;
      text.appendChild(title);
      text.appendChild(note);
      item.appendChild(dot);
      item.appendChild(text);
      stageListEl.appendChild(item);
    }

    function renderIdleStages() {
      stageListEl.innerHTML = "";
      DEFAULT_STAGES.forEach(stage => renderStageItem(stage));
    }

    function resetProgress() {
      progressSectionEl.classList.add("is-visible");
      progressTitleEl.textContent = "执行进度";
      renderIdleStages();
      cancelTaskBtn.hidden = true;
      closeProgressBtn.hidden = true;
      closeProgressBtn.disabled = true;
      activeTaskId = null;
    }

    function renderTask(task) {
      const title = TASK_TITLES[task.type] || "任务";
      progressSectionEl.classList.add("is-visible");
      progressTitleEl.textContent = `${title}：${task.stageLabel || "处理中"}`;
      activeTaskId = task.id;
      cancelTaskBtn.hidden = !task.running;
      cancelTaskBtn.disabled = !task.running;
      closeProgressBtn.hidden = task.running;
      closeProgressBtn.disabled = task.running;
      stageListEl.innerHTML = "";

      const currentIndex = task.stages.indexOf(task.stage);
      task.stages.forEach((stage, index) => {
        let state = "idle";
        let detail = "";
        if ((task.status === "error" || task.status === "cancelled") && stage === task.stage) {
          state = "error";
          detail = task.status === "cancelled" ? "任务已取消，未继续执行后续阶段" : (task.stageLabel || "该阶段执行失败");
        } else if (task.status === "success" || (currentIndex > index && currentIndex >= 0)) {
          state = "done";
        } else if (stage === task.stage) {
          state = "active";
          detail = task.stageLabel || stageCopy(stage).active;
        }
        renderStageItem(stage, state, detail);
      });
      outputEl.value = (task.logs || []).join("\n");
      outputEl.scrollTop = outputEl.scrollHeight;

      if (task.status === "success") setStatus("已完成", "ok");
      else if (task.status === "error") setStatus("执行失败", "err");
      else if (task.status === "cancelled") setStatus("已取消", "err");
      else setStatus(task.stageLabel || "执行中", "run");
    }

    function stageLabel(stage) {
      const labels = {
        preparing: "准备配置",
        "reading-yaml": "定位 YAML 文件",
        "starting-subconverter": "启动 subconverter",
        converting: "转换订阅",
        "writing-yaml": "写入 YAML",
        "uploading-router": "上传到路由器",
        "installing-shellcrash": "安装到 ShellCrash",
        "validating-config": "校验配置",
        "restarting-shellcrash": "重启 ShellCrash",
        finished: "完成"
      };
      return labels[stage] || stage;
    }

    function setBusy(busy) {
      busyButtons.forEach(btn => {
        if (btn) btn.disabled = busy;
      });
    }

    async function request(path, body) {
      const res = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.output || "请求失败");
      }
      return data;
    }

    function stopPolling() {
      if (activePoll) {
        clearTimeout(activePoll);
        activePoll = null;
      }
    }

    async function pollTask(taskId) {
      try {
        const data = await request(`/api/tasks/${encodeURIComponent(taskId)}`);
        renderTask(data.task);
        if (data.task.status === "success" || data.task.status === "error" || data.task.status === "cancelled") {
          setBusy(false);
          stopPolling();
          return;
        }
        activePoll = setTimeout(() => pollTask(taskId), 500);
      } catch (error) {
        outputEl.value = error.message;
        setStatus("查询任务失败", "err");
        setBusy(false);
        stopPolling();
      }
    }

    async function startTask(path, body, fallbackStatus) {
      stopPolling();
      resetProgress();
      outputEl.value = "";
      setBusy(true);
      setStatus(fallbackStatus, "run");
      try {
        const data = await request(path, body);
        activeTaskId = data.taskId;
        await pollTask(data.taskId);
      } catch (error) {
        outputEl.value = error.message;
        setStatus("启动失败", "err");
        setBusy(false);
      }
    }

    async function cancelActiveTask() {
      if (!activeTaskId) return;
      cancelTaskBtn.disabled = true;
      setStatus("正在取消", "run");
      try {
        const data = await request(`/api/tasks/${encodeURIComponent(activeTaskId)}/cancel`, {});
        renderTask(data.task);
        setBusy(false);
        stopPolling();
      } catch (error) {
        outputEl.value = `${outputEl.value ? `${outputEl.value}\n` : ""}${error.message}`;
        setStatus("取消失败", "err");
        cancelTaskBtn.disabled = false;
      }
    }

    async function loadConfig() {
      const data = await request("/api/config");
      fields.subscriptionUrl.value = data.subscriptionUrl || "";
      fields.routerHost.value = data.routerHost || "";
      fields.privateKey.value = data.privateKey || "";
      setAuthMethod(data.authMethod || "privateKey");
      fields.localYaml.value = data.localYaml || "";
      fields.restartShellCrash.checked = data.restartShellCrash !== false;
    }

    async function run(path, message) {
      await startTask(path, payload(), message);
    }

    async function uploadYaml() {
      try {
        await startTask("/api/tasks/upload-yaml", {
          ...payload(),
          ...(await readSelectedYaml())
        }, "上传 YAML 中");
      } catch (error) {
        outputEl.value = error.message;
        setStatus("读取文件失败", "err");
        setBusy(false);
      }
    }

    document.querySelector("#saveBtn").addEventListener("click", async () => {
      setBusy(true);
      try {
        await request("/api/config", payload());
        setStatus("已保存", "ok");
      } catch (error) {
        outputEl.value = error.message;
        setStatus("保存失败", "err");
      } finally {
        setBusy(false);
      }
    });
    document.querySelector("#convertBtn").addEventListener("click", () => run("/api/tasks/convert", "转换中"));
    document.querySelector("#uploadBtn").addEventListener("click", () => run("/api/tasks/upload", "转换并上传中"));
    document.querySelector("#uploadYamlBtn").addEventListener("click", uploadYaml);
    cancelTaskBtn.addEventListener("click", cancelActiveTask);
    closeProgressBtn.addEventListener("click", resetProgress);
    fields.authMethod.forEach(input => input.addEventListener("change", updateAuthFields));
    fields.yamlFile.addEventListener("change", updateYamlFileMeta);
    clearYamlBtn.addEventListener("click", clearSelectedYaml);
    window.addEventListener("beforeunload", stopPolling);

    updateYamlFileMeta();
    updateAuthFields();
    resetProgress();
    loadConfig().catch(error => {
      outputEl.value = error.message;
      setStatus("配置加载失败", "err");
    });
  </script>
</body>
</html>
